[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rgbd-dataset"
version = "0.1.0"
description = "Posed RGB-D dataset loader for SemiStaticSim sequences, used by Predictive Graphs."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "torch",
    "jax==0.8.1 ; sys_platform == 'darwin'",
    "jax[cuda12]==0.8.1 ; sys_platform == 'linux'",
    "numpy==2.1.2",
    "scipy",
    "open3d",
    "opencv-python",
    "natsort",
    "hydra-core>=1.3.2",
    "viser>=1.0.16",
    "semistaticsim>=0.5.1",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
